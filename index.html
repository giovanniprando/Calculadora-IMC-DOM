<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de IMC</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Calculadora de IMC</h1>
      <p>Cadastre uma pessoa e calcule seu Índice de Massa Corporal.</p>
    </header>

    <main>
      <section class="card">
        <h2>Cadastro</h2>

        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Digite o nome" />
        </div>

        <div class="campo">
          <label for="peso">Peso (kg)</label>
          <input type="number" id="peso" placeholder="Ex: 70" />
        </div>

        <div class="campo">
          <label for="altura">Altura (cm)</label>
          <input type="number" id="altura" placeholder="Ex: 175" />
        </div>

        <button id="btnCalcular">Calcular IMC</button>
      </section>

      <section class="card">
        <h2>Resultado</h2>

        <div id="resultado">
          <p>O resultado aparecerá aqui.</p>
        </div>
      </section>

      <section class="card">
        <div class="titulo-lista">
          <h2>Pessoas cadastradas</h2>

          <p>
            Total:
            <span id="totalPessoas">0</span>
          </p>
        </div>

        <div id="listaPessoas">
          <p>Nenhuma pessoa cadastrada ainda.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
